name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest

    steps:
      - uses: actions/checkout@v6

      - name: Build LaTeX documents
        run: find . -name .latexmkrc -execdir latexmk \;

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*.pdf

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ github.run_number }}"
          gh release create "$tag" ./*.pdf --title "$tag" --generate-notes
